name: Mobile build (EAS)
on:
  workflow_dispatch:
    inputs:
      profile: { description: "EAS profili", type: choice, options: [staging, production], default: staging }
      platform: { description: "Platform", type: choice, options: [all, ios, android], default: all }
      submit: { description: "Mağazaya gönder (yalnızca production)", type: boolean, default: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:shared
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: eas build --non-interactive --profile ${{ inputs.profile }} --platform ${{ inputs.platform }} ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.MOBILE_SENTRY_DSN }}

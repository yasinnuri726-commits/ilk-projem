[project]
name = "klipai-video"
version = "1.0.0"
description = "KlipAI video işleme ve yapay zeka hattı"
requires-python = ">=3.11"
dependencies = [
  "bullmq>=2.9",
  "redis>=5",
  "httpx>=0.27",
  "boto3>=1.34",
  "pydantic>=2.7",
  "numpy>=1.26",
  "anthropic>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Analiz worker'ı (GPU): transkript, sahne, yüz, konuşmacı ayrımı
analysis = [
  "faster-whisper>=1.1",
  "scenedetect>=0.6.4",
  "opencv-python-headless>=4.9",
  "pyannote.audio>=3.3",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klipai_video*"]

[tool.setuptools.package-data]
klipai_video = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
